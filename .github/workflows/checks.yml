# PC 연결형 펌웨어 빌드 + PC 쪽 테스트 (웹 배포 없음)
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usb-bridge-firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build usb-bridge
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd usb-bridge
          idf.py build

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Standalone C modules
        run: |
          sudo apt-get install -y --no-install-recommends libcjson-dev
          sh standalone/host_test/run.sh
      - name: PC bridge
        run: |
          pip install pyserial numpy soxr google-genai pytest
          cd bridge && python -m pytest -q
      - name: Gemini relay
        run: |
          pip install -r relay/requirements.txt
          cd relay && python -m pytest -q
      - name: Web settings page
        run: |
          cd web/test && npm install --no-audit --no-fund && npm test

  # 펌웨어에 내장한 루트 인증서(server_roots.pem)로 AI 서버의 실제 인증서 체인이 확인되는지.
  # valid-isrgrootx*.letsencrypt.org 는 Let's Encrypt 의 시험용 사이트 (중계 서버 인증서와 같은 루트).
  # 서버가 인증서 발급처를 바꾸면 여기서 먼저 깨진다 (기기에서는 "No matching trusted root" 로 연결 실패).
  tls-roots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify real server chains against the embedded roots
        run: |
          set -e
          for host in api.openai.com api.x.ai valid-isrgrootx1.letsencrypt.org valid-isrgrootx2.letsencrypt.org; do
            openssl s_client -connect "$host:443" -servername "$host" -showcerts </dev/null 2>/dev/null \
              | awk '/BEGIN CERT/{n++} n{print > ("cert" n ".pem")} /END CERT/{}'
            cat cert[2-9].pem > chain.pem 2>/dev/null || true
            echo "== $host: $(openssl x509 -in cert1.pem -noout -issuer)"
            openssl verify -CAfile standalone/main/server_roots.pem -untrusted chain.pem cert1.pem
            rm -f cert*.pem chain.pem
          done

  # relay/install.sh 를 실제 우분투(systemd)에서 끝까지 돌려 본다 (암호화 없는 --no-tls 경로).
  relay-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer in the checkout and probe the service
        run: |
          printf 'GEMINI_API_KEY=dummy\nRELAY_TOKEN=%s\n' "$(openssl rand -hex 24)" > relay/geminirelay.env
          # 시스템 파이썬이 오래된 서버(Ubuntu 20.04 = 3.8)처럼, uv 가 받은 독립 실행형 파이썬으로 시험한다
          sudo UV_PYTHON_PREFERENCE=only-managed bash relay/install.sh --no-tls
          systemctl is-active geminirelay
          systemctl show -p User --value geminirelay | grep -qx "$USER"   # sudo 를 실행한 사용자로 돈다
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/v1/realtime)" = 401
          # 다시 실행해도 된다 (업데이트)
          sudo bash relay/install.sh --no-tls
          sudo journalctl -u geminirelay -n 5 --no-pager
