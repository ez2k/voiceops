# PC 연결형 펌웨어 빌드 + PC 쪽 테스트 (웹 배포 없음)
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usb-bridge-firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build usb-bridge
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd usb-bridge
          idf.py build

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Standalone C modules
        run: |
          sudo apt-get install -y --no-install-recommends libcjson-dev
          sh standalone/host_test/run.sh
      - name: PC bridge
        run: |
          pip install pyserial numpy soxr google-genai pytest
          cd bridge && python -m pytest -q
      - name: Web settings page
        run: |
          cd web/test && npm install --no-audit --no-fund && npm test

  # 펌웨어에 내장한 루트 인증서(google_roots.pem)로 AI 서버의 실제 인증서 체인이 확인되는지.
  # 서버가 인증서 발급처를 바꾸면 여기서 먼저 깨진다 (기기에서는 "No matching trusted root" 로 연결 실패).
  tls-roots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify api.openai.com and api.x.ai chains against the embedded roots
        run: |
          set -e
          for host in api.openai.com api.x.ai; do
            openssl s_client -connect "$host:443" -servername "$host" -showcerts </dev/null 2>/dev/null \
              | awk '/BEGIN CERT/{n++} n{print > ("cert" n ".pem")} /END CERT/{}'
            cat cert[2-9].pem > chain.pem 2>/dev/null || true
            echo "== $host: $(openssl x509 -in cert1.pem -noout -issuer)"
            openssl verify -CAfile standalone/main/google_roots.pem -untrusted chain.pem cert1.pem
            rm -f cert*.pem chain.pem
          done
